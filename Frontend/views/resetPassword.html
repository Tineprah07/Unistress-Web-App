<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniStress | Reset Password</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/reset-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2 id="authTitle">Set New Password</h2>
                <p class="auth-description">Choose a strong, unique password to secure your account.</p>
            </div>

            <form id="resetPasswordForm" class="form">
                <label class="field">
                    <span class="field-label">New Password</span>
                    <div class="password-wrapper">
                    <input class="field-input" type="password" id="resetPasswordInput" name="newPassword" placeholder="Min. 8 characters" required>
                    <i class="fa-solid fa-eye toggle-password" id="toggleResetPassword"></i>
                    </div>
                    <div class="password-hint" id="passwordHint">Strength: Short</div>
                </label>

                <button type="submit" class="btn btn-primary" id="submitBtn">Update Password</button>

                <p class="form-footer">
                    <a href="/views/auth.html" class="link">Back to sign in</a>
                </p>
                </form>

        </div>
    </div>

    <div id="notificationBanner" class="notification-banner">
        <i id="bannerIcon"></i>
        <span id="bannerMessage"></span>
    </div>

    <script src="/js/resetPassword.js"></script>
</body>
</html>
