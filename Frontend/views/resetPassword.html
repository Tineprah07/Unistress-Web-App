<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniStress | Reset Password</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/button/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2 id="authTitle">Set New Password</h2>
                <p class="auth-description">Choose a strong, unique password to secure your account.</p>
            </div>

            <form id="resetPasswordForm" class="auth-form">
                <div class="field">
                    <label for="resetPasswordInput">New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="resetPasswordInput" name="newPassword" placeholder="Min. 8 characters" required>
                        <i class="fa-solid fa-eye toggle-password" id="toggleResetPassword"></i>
                    </div>
                    <div class="password-hint">Strength: Short</div>
                </div>

                <button type="submit" class="auth-button">
                    <span>Update Password</span>
                </button>

                <div class="form-footer">
                    <a href="/views/auth.html" class="link" id="backToLoginFromReset">Back to sign in</a>
                </div>
            </form>
        </div>
    </div>

    <div id="notificationBanner" class="notification-banner">
        <i id="bannerIcon"></i>
        <span id="bannerMessage"></span>
    </div>

    <script src="/js/resetPassword.js"></script>
</body>
</html>
